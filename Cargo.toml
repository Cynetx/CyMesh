[workspace]
resolver = "2"
members = [
    "crates/aegis-core",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Cynet", "Cymesh Contributors"]
homepage = "https://cynetx.ir"
repository = "https://github.com/Cynetx/CyMesh"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
